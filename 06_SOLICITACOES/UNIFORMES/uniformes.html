<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Solicitações de Uniforme</title>
    <link rel="stylesheet" href="css/uniformes.css" />
  </head>
  <body>
    <div class="container">
      <div class="top-bar">
        <h2>Solicitações de Uniforme</h2>

        <div class="acoes-topo">
          <button class="btn-topo btn-add" onclick="abrirModal()">
            ➕ Novo Pedido
          </button>
          <button class="btn-topo btn-pdf" onclick="gerarPDF()">
            📄 Exportar PDF
          </button>
        </div>
      </div>

      <!-- SOLICITAÇÕES -->
      <div class="card">
        <div class="card-header">
          <h3>📥 Solicitações</h3>
        </div>

        <table class="tabela">
          <thead>
            <tr>
              <th>DATA</th>
              <th>NOME</th>
              <th>CARGO</th>
              <th>EMPRESA</th>
              <th>ITEM</th>
              <th>TAMANHO</th>
              <th>QTD</th>
              <th>STATUS</th>
              <th>AÇÕES</th>
            </tr>
          </thead>
          <tbody id="listaPedidos"></tbody>
        </table>
      </div>

      <!-- ESTOQUE -->
      <div class="card">
        <div class="card-header">
          <h3>📦 Uniformes em Estoque</h3>
        </div>

        <table class="tabela">
          <thead>
            <tr>
              <th>DATA</th>
              <th>NOME</th>
              <th>CARGO</th>
              <th>EMPRESA</th>
              <th>ITEM</th>
              <th>TAMANHO</th>
              <th>QTD</th>
              <th>STATUS</th>
              <th>AÇÕES</th>
            </tr>
          </thead>
          <tbody id="listaEstoque"></tbody>
        </table>
      </div>

      <!-- FINALIZADOS (ENTREGUES) -->
      <div class="card">
        <div class="card-header">
          <h3>✅ Uniformes Finalizados (Entregues)</h3>
          <button
            class="btn-limpar-card"
            onclick="limparFinalizados()"
            title="Limpar finalizados"
          >
            🧹
          </button>
        </div>

        <table class="tabela">
          <thead>
            <tr>
              <th>DATA</th>
              <th>NOME</th>
              <th>CARGO</th>
              <th>EMPRESA</th>
              <th>ITEM</th>
              <th>TAMANHO</th>
              <th>QTD</th>
              <th>STATUS</th>
              <th>AÇÕES</th>
            </tr>
          </thead>
          <tbody id="listaFinalizados"></tbody>
        </table>
      </div>
    </div>

    <!-- MODAL PEDIDO (novo / editar) -->
    <div class="modal" id="modal">
      <div class="modal-content">
        <h3 id="modalTitulo">Novo Pedido</h3>

        <input
          type="text"
          id="buscaNome"
          placeholder="Buscar funcionário..."
          autocomplete="off"
        />
        <select id="selectFuncionario"></select>

        <input type="text" id="cargo" placeholder="Cargo" disabled />
        <input type="text" id="empresa" placeholder="Empresa" disabled />

        <input type="text" id="item" placeholder="Item" />
        <input type="text" id="tamanho" placeholder="Tamanho" />
        <input type="number" id="unidade" min="1" placeholder="Quantidade" />

        <div class="modal-buttons">
          <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
          <button class="btn-save" onclick="salvarPedido()">Salvar</button>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <script type="module" src="js/uniformes.js?v=3"></script>
  </body>
</html>
